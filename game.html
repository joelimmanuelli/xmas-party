<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Who Wrote This?</title>
<style>
@font-face{font-family:"Figtree";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/figtree-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/figtree-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/figtree-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Caveat Brush";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/caveat-brush-latin-400-normal.woff2) format("woff2")}
:root{
  /* One world for TV and phones, taken from the party deck: peach sky, coral brush script, teal text.
     Answer tiles use four fixed colours with a symbol each, the same order on the TV and every phone. */
  color-scheme:light;
  --peach:#FBE6DC; --card:#FFF7F2; --coral:#E8553E; --teal:#2F5F5A; --muted:#5E7774; --line:#EBCDBF;
  --o1:#D9452E; --o2:#2F6B64; --o3:#A86B0A; --o4:#5A4A8C; --good:#2F7D4F;
  --script:"Caveat Brush","Figtree",cursive; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--peach);color:var(--teal);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,textarea{font:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:relative;z-index:3;min-height:100%;display:flex;flex-direction:column}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:16px}
.tv .wrap{max-width:1500px;padding:clamp(16px,3vmin,40px) clamp(16px,4vmin,56px)}
h1,.script{font-family:var(--script);font-weight:400;color:var(--coral);margin:0;line-height:1;transform:rotate(-1.5deg)}
h1{font-size:clamp(2.6rem,11vw,3.6rem)}
.tv h1{font-size:clamp(3rem,9vmin,7rem)}
.eyebrow{margin:0;font-size:.8rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.tv .eyebrow{font-size:clamp(.9rem,2vmin,1.4rem)}
p{margin:0}
.lead{font-size:1.05rem}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{appearance:none;border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:1rem;cursor:pointer;background:var(--coral);color:#fff;min-height:48px}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--teal);border:2px solid var(--teal)}
.btn.small{padding:8px 12px;min-height:36px;font-size:.9rem}
.btn.quiet{background:transparent;color:var(--muted);text-decoration:underline;padding:8px;min-height:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.lbl{font-weight:700;font-size:.85rem;letter-spacing:.04em}
input[type="text"],textarea{width:100%;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--teal);padding:12px 14px;font-size:1.05rem}
input[type="text"]:focus,textarea:focus{border-color:var(--teal);outline:none}
textarea{resize:vertical;min-height:90px}
.count{font-size:.8rem;color:var(--muted);text-align:right}
.err{color:var(--o1);font-weight:600;font-size:.92rem}
.seg{display:flex;background:#fff;border:2px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff}
.entry{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.entry .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.entry img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none;background:var(--line)}
.slot-n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.85rem;background:#fff;border:1px solid var(--line)}
.pill.ok{background:var(--good);color:#fff;border-color:var(--good)}
.status{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:5;font-size:.8rem;font-weight:600;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 11px;color:var(--muted)}
.status.bad{color:var(--o1);border-color:var(--o1)}

/* question + options */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.timer{height:8px;border-radius:999px;background:#fff;overflow:hidden;border:1px solid var(--line)}
.timer i{display:block;height:100%;width:100%;background:var(--coral);transform-origin:left;transition:transform .25s linear}
.fact{background:#fff;border-radius:18px;padding:18px 20px;font-size:1.25rem;font-weight:600;line-height:1.35;text-align:center;overflow-wrap:anywhere;border:1px solid var(--line)}
.fact::before{content:"\201C"}.fact::after{content:"\201D"}
.fact.photo::before,.fact.photo::after{content:none}
.photo-box{background:#fff;border:6px solid #fff;border-bottom-width:28px;border-radius:6px;box-shadow:0 6px 20px rgba(80,40,20,.18);align-self:center;transform:rotate(-2deg);max-width:100%}
.photo-box img{display:block;max-width:100%;max-height:38vh;object-fit:contain}
.tv .photo-box img{max-height:40vh}
.tv .rev .photo-box img{max-height:30vh}
.tv .rev .fact{font-size:clamp(1.2rem,3.4vmin,2.4rem)}
.ask{text-align:center;font-family:var(--script);font-size:2rem;color:var(--coral);line-height:1}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;border:0;border-radius:14px;color:#fff;font-weight:700;font-size:1.1rem;padding:18px 12px 18px 44px;text-align:left;min-height:72px;cursor:pointer;overflow-wrap:anywhere;display:flex;align-items:center;line-height:1.2}
.opt::before{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:1.15rem}
.opt.c0{background:var(--o1)}.opt.c0::before{content:"\2605"}
.opt.c1{background:var(--o2)}.opt.c1::before{content:"\25CF"}
.opt.c2{background:var(--o3)}.opt.c2::before{content:"\25B2"}
.opt.c3{background:var(--o4)}.opt.c3::before{content:"\25C6"}
.opt:disabled{cursor:default}
.opts.locked .opt:not(.picked){opacity:.3}
.opt.picked{outline:4px solid var(--teal);outline-offset:3px}
.opts.reveal .opt:not(.right){opacity:.28}
.opt.right{outline:4px solid var(--good);outline-offset:3px}
.opt .n{margin-left:auto;padding-left:10px;font-size:1.3em;font-variant-numeric:tabular-nums}
.big-msg{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;padding:18px 8px}
.big-msg .script{font-size:2.6rem}
.score{font-variant-numeric:tabular-nums;font-weight:700}

/* TV */
.tv-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(16px,3vmin,40px);align-items:start}
.qr{background:#fff;border-radius:16px;padding:12px;width:clamp(160px,31vmin,340px);aspect-ratio:1}
.qr svg{display:block;width:100%;height:100%}
.joinurl{font-weight:700;font-size:clamp(1rem,2.4vmin,1.6rem);overflow-wrap:anywhere}
.players{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:clamp(.95rem,2vmin,1.3rem)}
.chip .dots{letter-spacing:2px;color:var(--coral)}
.chip.ready{border-color:var(--good)}
.chip .tick{color:var(--good)}
.tv .fact{font-size:clamp(1.6rem,5.2vmin,3.6rem);padding:clamp(18px,3.5vmin,44px)}
.tv .ask{font-size:clamp(2.2rem,6vmin,4.5rem)}
.tv .opts{gap:clamp(10px,1.8vmin,22px)}
.tv .opt{font-size:clamp(1.3rem,3.6vmin,2.6rem);min-height:clamp(70px,12vmin,140px);padding-left:clamp(44px,6vmin,80px)}
.tv .opt::before{left:clamp(14px,2vmin,26px);font-size:1em}
.tv .timer{height:clamp(8px,1.4vmin,16px)}
.tv .qhead{font-size:clamp(1rem,2.6vmin,1.8rem);font-weight:700}
.reveal-who{text-align:center}
.reveal-who .script{font-size:clamp(2.6rem,8vmin,6.5rem)}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.board li{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;font-size:clamp(1rem,2.4vmin,1.7rem)}
.board .rk{width:1.8em;color:var(--coral);font-variant-numeric:tabular-nums}
.board .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .gain{color:var(--good);font-size:.8em;font-variant-numeric:tabular-nums}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:clamp(8px,2vmin,24px);max-width:900px;margin:0 auto;width:100%}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.pod .nm{font-weight:700;font-size:clamp(1.1rem,3vmin,2.2rem);overflow-wrap:anywhere}
.pod .blk{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:center;color:#fff;font-family:var(--script);font-size:clamp(2.4rem,7vmin,5rem)}
.pod.p1 .blk{height:clamp(140px,26vmin,300px);background:var(--o1)}
.pod.p2 .blk{height:clamp(100px,18vmin,210px);background:var(--o2)}
.pod.p3 .blk{height:clamp(70px,12vmin,140px);background:var(--o3)}
.hostbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.hostbar .grow{flex:1}
select{font:inherit;border:2px solid var(--line);border-radius:10px;padding:8px;background:#fff;color:var(--teal)}
/* garland of lights */
#garland{position:fixed;left:0;right:0;top:0;height:52px;pointer-events:none;z-index:3}
#garland svg{display:block;width:100%;height:100%}
.bulb{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}
.wrap{padding-top:58px}
.tv .wrap{padding-top:clamp(56px,8vmin,80px)}
/* scene: cottage + elves + ground (TV start, lobby, winners) */
#cottage{position:fixed;right:5vw;bottom:9vh;width:clamp(130px,22vmin,260px);z-index:1;pointer-events:none;display:none}
body[data-scene="full"] #cottage{display:block}
body.tv[data-scene="full"] .wrap{padding-bottom:26vh}
.smoke{animation:smoke 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.smoke.s2{animation-delay:1.3s}.smoke.s3{animation-delay:2.6s}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:.8}100%{transform:translate(-14px,-46px) scale(1.6);opacity:0}}
#elves{position:fixed;left:0;right:0;bottom:0;height:30vh;pointer-events:none;z-index:2;overflow:hidden}
#garland{z-index:4}
.elf{position:absolute;left:0;bottom:var(--y);width:var(--w);animation:stroll var(--d) linear infinite;animation-delay:var(--dl)}
.elf .flip{animation:face var(--d) step-end infinite;animation-delay:var(--dl)}
.elf .pop{position:relative}
.elf.new .pop{animation:pop .7s cubic-bezier(.3,1.7,.5,1)}
@keyframes stroll{0%{transform:translateX(var(--a))}50%{transform:translateX(var(--b))}100%{transform:translateX(var(--a))}}
@keyframes face{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
@keyframes pop{0%{transform:translateY(40px) scale(.2)}100%{transform:none}}
.elf .tag{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:2px;background:#fff;color:var(--teal);border:2px solid var(--line);border-radius:999px;padding:2px 10px;font-weight:700;font-size:clamp(.75rem,1.7vmin,1.05rem);white-space:nowrap}
.elf .tag.ready{border-color:var(--good);color:var(--good)}
.elf-svg{display:block;width:100%;height:auto;overflow:visible;animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3%)}}
.elf-svg .leg-l{transform-origin:25px 64px;animation:leg .5s ease-in-out infinite alternate}
.elf-svg .leg-r{transform-origin:35px 64px;animation:leg .5s ease-in-out infinite alternate-reverse}
.elf-svg .arm-l{transform-origin:12px 44px;animation:leg .5s ease-in-out infinite alternate-reverse}
.elf-svg .arm-r{transform-origin:48px 44px;animation:leg .5s ease-in-out infinite alternate}
@keyframes leg{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.still .elf-svg,.still .elf-svg *{animation:none!important}
.cheer .elf-svg{animation:jump .55s cubic-bezier(.3,.6,.4,1) infinite alternate}
.cheer .elf-svg .leg-l,.cheer .elf-svg .leg-r{animation:none}
.cheer .elf-svg .arm-l{animation:none;transform:rotate(150deg)}
.cheer .elf-svg .arm-r{animation:none;transform:rotate(-150deg)}
@keyframes jump{from{transform:translateY(0)}to{transform:translateY(-16%)}}
.wave .elf-svg{animation:none}.wave .elf-svg .leg-l,.wave .elf-svg .leg-r,.wave .elf-svg .arm-l{animation:none}
.wave .elf-svg .arm-r{animation:wave .6s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-120deg)}to{transform:rotate(-165deg)}}
.me-elf{display:flex;align-items:center;gap:12px}
.me-elf .pic{width:64px;flex:none}
/* host start screen */
.hero{display:flex;flex-direction:column;gap:clamp(10px,2vmin,22px);max-width:980px}
.hero h1{font-size:clamp(3.4rem,13vmin,10rem)}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,2vmin,20px)}
.step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(12px,2vmin,20px);display:flex;flex-direction:column;gap:6px}
.step .n{font-family:var(--script);color:var(--coral);font-size:clamp(2rem,5vmin,3.2rem);line-height:1}
.step p{font-size:clamp(.95rem,2vmin,1.3rem);font-weight:600}
.btn.huge{font-size:clamp(1.1rem,2.6vmin,1.7rem);padding:clamp(14px,2.2vmin,22px) clamp(22px,3.4vmin,40px);align-self:flex-start;border-radius:16px;box-shadow:0 6px 0 #B83A26;transition:transform .1s}
.btn.huge:active{transform:translateY(4px);box-shadow:0 2px 0 #B83A26}
#music{position:fixed;bottom:12px;left:12px;z-index:6;font-size:.85rem;background:#fff;color:var(--teal);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer}
#music[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
/* winners */
.done-wrap{min-height:100vh;min-height:100dvh}
.done-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.done-head h1{font-size:clamp(2.6rem,8vmin,6rem)}
.also{display:flex;flex-wrap:wrap;gap:8px}
.podium2{margin-top:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:clamp(8px,2vmin,26px);width:100%;max-width:1100px;align-self:center}
.pcol{display:flex;flex-direction:column;align-items:center}
.pcol .who{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;animation:whoIn .7s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--dl) + .55s)}
@keyframes whoIn{from{opacity:0;transform:translateY(30px) scale(.6)}to{opacity:1;transform:none}}
.pcol .elfstand{width:clamp(56px,11vmin,120px);position:relative;z-index:1}
.pcol.p1 .elfstand{width:clamp(66px,14vmin,150px)}
.pcol .nm{font-family:var(--script);color:var(--coral);font-size:clamp(1.6rem,5vmin,3.6rem);line-height:1;text-align:center;overflow-wrap:anywhere;position:relative;z-index:1}
.pcol .pts{font-weight:700;font-variant-numeric:tabular-nums;font-size:clamp(.95rem,2.2vmin,1.5rem);background:#fff;border-radius:999px;padding:2px 12px;border:1px solid var(--line);position:relative;z-index:1}
.pcol .blk{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:center;color:#fff;font-family:var(--script);font-size:clamp(2.4rem,8vmin,6rem);transform-origin:bottom;animation:rise .8s cubic-bezier(.2,1.2,.4,1) both;animation-delay:var(--dl);box-shadow:inset 0 -10px 0 rgba(0,0,0,.12);margin-top:6px}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.pcol.p1 .blk{height:clamp(120px,24vmin,280px);background:var(--o1)}
.pcol.p2 .blk{height:clamp(84px,16vmin,190px);background:var(--o2)}
.pcol.p3 .blk{height:clamp(56px,10vmin,120px);background:var(--o3)}
.pcol.empty .blk{opacity:.25}
.star{font-size:clamp(2rem,6vmin,4.4rem);color:#E2B452;line-height:1;animation:glow 1.4s ease-in-out infinite alternate;text-shadow:0 0 18px rgba(226,180,82,.8);position:relative;z-index:1}
@keyframes glow{from{transform:scale(.9) rotate(-8deg)}to{transform:scale(1.12) rotate(8deg)}}
.rays{position:absolute;left:50%;top:40%;width:clamp(220px,46vmin,520px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.75) 0 10deg,rgba(255,255,255,0) 10deg 20deg);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:spin 14s linear infinite;z-index:0}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
body.tv[data-scene="full"] .wrap.done-wrap{padding-bottom:11vh}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:7}
/* cropper */
.cropper{display:flex;flex-direction:column;gap:10px}
.crop-frame{position:relative;width:100%;overflow:hidden;border-radius:12px;background:#2E2A26;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.crop-frame:active{cursor:grabbing}
.crop-frame img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;pointer-events:none;-webkit-user-drag:none}
.crop-frame::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,transparent 33.2%,rgba(255,255,255,.35) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.35) 66.6%,transparent 66.8%),linear-gradient(to bottom,transparent 33.2%,rgba(255,255,255,.35) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.35) 66.6%,transparent 66.8%);border:2px solid rgba(255,255,255,.8);border-radius:12px}
input[type="range"]{width:100%;accent-color:var(--coral)}
.entry .sub{display:block;font-size:.85rem;color:var(--muted)}
@media (max-width:820px){.tv-grid{grid-template-columns:1fr}.steps3{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){.elf,.elf .flip,.elf-svg,.elf-svg *,.bulb,.rays,.star,.smoke{animation:none!important}}
@media (max-width:380px){.opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div id="garland" aria-hidden="true"></div>
<div id="cottage" aria-hidden="true"><svg viewBox="0 0 200 175" width="100%">
  <circle class="smoke" cx="146" cy="14" r="7" fill="#fff" opacity=".8"/><circle class="smoke s2" cx="146" cy="14" r="6" fill="#fff" opacity=".8"/><circle class="smoke s3" cx="146" cy="14" r="5" fill="#fff" opacity=".8"/>
  <rect x="137" y="22" width="18" height="44" fill="#B5654A"/><rect x="134" y="18" width="24" height="8" rx="3" fill="#fff"/>
  <rect x="30" y="82" width="140" height="86" fill="#D98C6A"/>
  <path d="M14 92 L100 26 L186 92 Z" fill="#9E4E3A"/>
  <path d="M10 94 L100 22 L190 94 Q182 100 174 94 Q166 102 158 94 Q148 101 140 94 Q130 102 120 94 Q110 101 100 94 Q90 102 80 94 Q70 101 60 94 Q50 102 40 94 Q30 101 22 94 Q15 99 10 94 Z" fill="#fff"/>
  <rect x="44" y="104" width="30" height="26" rx="3" fill="#FFD98A" stroke="#fff" stroke-width="4"/><path d="M59 104v26M44 117h30" stroke="#fff" stroke-width="3"/>

/* ---------- confetti ---------- */
const Confetti = (() => {
  const cv = $('#confetti'), cx = cv.getContext('2d'), cols = ['#E8553E', '#E2B452', '#2F9E8A', '#5A4A8C', '#FFFFFF', '#C2185B', '#3E7D3A'];
  let parts = [], raf = 0, trickle = false;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const size = () => { const r = Math.min(devicePixelRatio || 1, 2); cv.width = innerWidth * r; cv.height = innerHeight * r; cx.setTransform(r, 0, 0, r, 0, 0); };
  size(); addEventListener('resize', size);
  const piece = (x, y, vx, vy) => ({ x, y, vx, vy, w: 6 + Math.random() * 6, rot: Math.random() * 6.3, vr: (Math.random() - 0.5) * 0.3, c: cols[Math.floor(Math.random() * cols.length)] });
  function run() {
    if (raf || still) return;
    const step = () => {
      cx.clearRect(0, 0, innerWidth, innerHeight);
      if (trickle && Math.random() < 0.35) parts.push(piece(Math.random() * innerWidth, -12, (Math.random() - 0.5), 1 + Math.random() * 1.5));
      parts = parts.filter(p => p.y < innerHeight + 30);
      for (const p of parts) {
        p.vy = Math.min(p.vy + 0.22, 3.2 + p.w * 0.1); p.vx *= 0.985; p.x += p.vx + Math.sin(p.rot) * 0.6; p.y += p.vy; p.rot += p.vr;
        cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.scale(1, Math.cos(p.rot * 2)); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2); cx.restore();
      }
      raf = (parts.length || trickle) ? requestAnimationFrame(step) : (cx.clearRect(0, 0, innerWidth, innerHeight), 0);
    };
    raf = requestAnimationFrame(step);
  }
  return {
    burst(n = 180) { for (let i = 0; i < n; i++) parts.push(piece(innerWidth * (0.15 + Math.random() * 0.7), innerHeight * (0.25 + Math.random() * 0.2), (Math.random() - 0.5) * 16, -6 - Math.random() * 12)); run(); },
    rain(v) { trickle = v; if (v) run(); },
  };
})();

function questionScreen(w, q) {
  const g0 = game(), st = g0.st, key = st.gid + '-' + st.qi;
  if (qSeenAt.key !== key) qSeenAt = { key, t: Date.now() };
  const lim = (st.limit || 20) * 1000;
  const hd = h('div', 'qhead'); hd.appendChild(h('span', 'eyebrow', 'Question ' + (st.qi + 1) + ' of ' + st.qs.length)); w.appendChild(hd);
  const bar = timerBar(); w.appendChild(bar);
  const entry = g0.entries.find(e => e.id === q.e);
  w.appendChild(factView(entry));
  const area = h('div'); w.appendChild(area);
  const tick = setInterval(() => {
    if (!document.contains(bar)) return clearInterval(tick);
    const left = Math.max(0, 1 - (Date.now() - qSeenAt.t) / lim);
    bar.firstChild.style.transform = 'scaleX(' + left + ')';
  }, 250);
  function update() {
    const g = game(); area.textContent = '';
    if (q.a === PID) {
      const m = h('div', 'card big-msg'); m.appendChild(h('p', 'script', 'This one’s yours!')); m.appendChild(h('p', 'lead', 'Keep a straight face while everyone guesses.'));
      area.appendChild(m); return;
    }
    const mine = g.answers.find(a => a.qi === st.qi && a.pid === PID);
    area.appendChild(h('p', 'ask', askText(g.entries.find(e => e.id === q.e))));
    area.appendChild(optionGrid(g, q, {
      picked: mine && mine.choice,
      pick: async pid => {
        const ms = Date.now() - qSeenAt.t;
        if (ms > lim + 1500) return;
        try { await db.set('wwt-answer/' + st.gid + '_' + st.qi + '_' + PID, { gid: st.gid, qi: st.qi, pid: PID, choice: pid, ms }); } catch (e) {}
      },
    }));
    if (mine) area.appendChild(h('p', 'muted', 'Locked in. Watch the TV for the answer.'));
  }
  return { update };
}

function revealScreenPhone(w, q) {
  const g = game(), st = g.st;
  w.appendChild(h('p', 'eyebrow', 'Question ' + (st.qi + 1) + ' of ' + st.qs.length));
  const m = h('div', 'card big-msg'); w.appendChild(m);
  const author = nameOf(g, q.a);
  if (q.a === PID) {
    const guessers = g.answers.filter(a => a.qi === st.qi && a.pid !== PID);
    const right = guessers.filter(a => a.choice === q.a).length;
    m.appendChild(h('p', 'script', right === 0 && guessers.length ? 'Nobody guessed you!' : right + ' of ' + guessers.length + ' guessed you'));
  } else {

    if (mine && mine.choice === q.a) { m.appendChild(h('p', 'script', 'Correct!')); m.appendChild(h('p', 'score', '+' + points(st, mine, q))); }
    else { m.appendChild(h('p', 'script', mine ? 'Not quite' : 'Too slow!')); m.appendChild(h('p', 'lead', 'It was ' + author + '.')); }

  const board = scores(g, st.qi), r = rankOf(board, PID);
  if (r) w.appendChild(h('p', 'lead', 'You’re ' + ordinal(r) + ' with ' + board[r - 1].score.toLocaleString() + ' points.'));

  Sound.showButton(true);
  const phase = !st || st.phase === 'off' ? 'start' : st.phase;
  setScene(phase === 'start' || phase === 'lobby' || phase === 'done' ? 'full' : 'none');
  if (phase !== 'done') Confetti.rain(false);
  if (phase === 'start') {
    syncElves(['e1', 'e2', 'e3', 'e4', 'e5'].map(id => ({ id: 'decor-' + id })));
    Sound.theme('lobby');
    return show('start', w => hostStart(w));
  }
  if (phase === 'lobby') { Sound.theme('lobby'); return show('lobby-' + st.gid, w => hostLobby(w)); }
  if (phase === 'done') { syncElves([]); return show('done-' + st.gid, w => hostDone(w)); }
  syncElves([]); Sound.theme(null);
  const q = (st.qs || [])[st.qi]; if (!q) return;
  if (st.phase === 'play') return show('q-' + st.gid + '-' + st.qi, w => hostQuestion(w, q));
  if (st.phase === 'reveal') return show('r-' + st.gid + '-' + st.qi, w => hostReveal(w, q));
}

function hostStart(w) {
  const hero = h('div', 'hero');
  hero.append(h('p', 'eyebrow', 'Christmas party game'), h('h1', '', 'Who Wrote This?'));
  hero.appendChild(h('p', 'lead', 'Everyone sneaks in a fact or a photo about themselves. Then we guess who it belongs to.'));
  const steps = h('div', 'steps3');
  [['Join', 'Scan the code on the TV with your phone and pick a name.'], ['Sneak in', 'Add up to 2 facts or photos about yourself. Keep it secret!'], ['Guess', 'Pick who it belongs to from 4 names. Faster right answers score more.']]
    .forEach(([t, d], i) => { const s = h('div', 'step'); s.append(h('span', 'n', String(i + 1)), h('p', '', t), h('p', 'muted', d)); steps.appendChild(s); });
  hero.appendChild(steps);
  const b = h('button', 'btn huge', 'Start a new game'); b.type = 'button';
  b.addEventListener('click', () => { Sound.unlock(); newGame(b); });
  hero.appendChild(b);
  w.appendChild(hero);
}

async function newGame(btn) {
  if (btn) btn.disabled = true;
  const gid = rid();
  try {
    await Promise.all([db.delPrefix('wwt-answer/'), db.delPrefix('wwt-entry/'), db.delPrefix('wwt-player/')]);
    await db.clearPhotosExcept(gid).catch(() => {});
    await db.set('wwt-state/main', { gid, phase: 'lobby', qi: 0, qs: [], limit: (db.get('wwt-state/main') || {}).limit || 20, at: Date.now() });
  } catch (e) { if (btn) btn.disabled = false; }
}

function hostLobby(w) {
  const joinUrl = location.origin + location.pathname;
  const top = h('div', 'hostbar');
  const title = h('div', 'grow'); title.appendChild(h('p', 'eyebrow', 'Join on your phone')); title.appendChild(h('h1', '', 'Who Wrote This?'));
  top.appendChild(title); w.appendChild(top);
  const grid = h('div', 'tv-grid'); w.appendChild(grid);
  const left = h('div', 'card');
  const qrBox = h('div', 'qr');
  try { const qr = qrcode(0, 'M'); qr.addData(joinUrl); qr.make(); qrBox.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); } catch (e) {}
  left.append(h('p', 'lbl', 'Scan to join, or open'), qrBox, h('p', 'joinurl', joinUrl.replace(/^https?:\/\//, '')));
  left.appendChild(h('p', 'muted', 'Add up to 2 facts or photos about yourself. Everyone guesses who wrote each one.'));
  grid.appendChild(left);
  const right = h('div', 'card'); grid.appendChild(right);
  const counts = h('p', 'lbl'), players = h('div', 'players');
  right.append(counts, players);
  const bar = h('div', 'hostbar'); right.appendChild(bar);
  const limLbl = h('label', 'lbl', 'Seconds per question '); const lim = h('select'); lim.id = 'limit';
  [15, 20, 30].forEach(s => { const o = h('option', '', String(s)); o.value = s; lim.appendChild(o); });
  limLbl.appendChild(lim);
  const startB = h('button', 'btn', 'Start the game'); startB.type = 'button';
  const resetB = h('button', 'btn ghost small', 'Clear and start over'); resetB.type = 'button';
  bar.append(limLbl, h('span', 'grow'), resetB, startB);
  startB.classList.add('huge');
  lim.addEventListener('change', () => { const st = game().st; db.set('wwt-state/main', { ...st, limit: Number(lim.value) }).catch(() => {}); });
  resetB.addEventListener('click', () => {
    if (armed !== 'reset') { armed = 'reset'; resetB.textContent = 'Tap again to clear everyone'; setTimeout(() => { if (armed === 'reset') { armed = ''; resetB.textContent = 'Clear and start over'; } }, 3500); return; }
    armed = ''; newGame(resetB);
  });
  startB.addEventListener('click', () => startGame(startB));
  let first = true;
  function update() {
    const g = game();
    syncElves(g.players.map(p => ({ id: p.id, name: txt(p.name), ready: !!p.ready })), { sound: !first }); first = false;
    lim.value = String(g.st.limit || 20);
    const nE = g.entries.length, nR = g.players.filter(p => p.ready).length;
    counts.textContent = g.players.length + (g.players.length === 1 ? ' player' : ' players') + ' · ' + nE + (nE === 1 ? ' fact or photo' : ' facts and photos') + ' · ' + nR + ' ready';
    players.textContent = '';
    if (!g.players.length) players.appendChild(h('p', 'muted', 'Waiting for people to join…'));
    g.players.forEach(p => {
      const n = g.entries.filter(e => e.pid === p.id).length;
      const c = h('span', 'chip' + (p.ready ? ' ready' : ''));
      c.appendChild(h('span', '', txt(p.name)));
      c.appendChild(h('span', 'dots', '●'.repeat(n) + '○'.repeat(Math.max(0, MAX_ENTRIES - n))));
      if (p.ready) c.appendChild(h('span', 'tick', '✓'));
      players.appendChild(c);
    });
    const authors = new Set(g.entries.map(e => e.pid));
    startB.disabled = g.players.length < 2 || !g.entries.some(e => g.players.some(p => p.id === e.pid));
    startB.title = startB.disabled ? 'Needs at least 2 players and 1 fact or photo' : '';
  }
  return { update };
}

async function startGame(btn) {
  const g = game();
  const ids = g.players.map(p => p.id);
  let es = shuffle(g.entries.filter(e => ids.includes(e.pid)));
  for (let i = 1; i < es.length; i++) if (es[i].pid === es[i - 1].pid) {
    const j = es.findIndex((e, k) => k > i && e.pid !== es[i - 1].pid);
    if (j > 0) [es[i], es[j]] = [es[j], es[i]];
  }
  const qs = es.map(e => ({ e: e.id, a: e.pid, o: shuffle([e.pid, ...shuffle(ids.filter(x => x !== e.pid)).slice(0, 3)]) }));
  if (!qs.length) return;
  btn.disabled = true;
  try { await db.set('wwt-state/main', { ...g.st, phase: 'play', qi: 0, qs, at: Date.now() }); } catch (e) { btn.disabled = false; }
}

function hostQuestion(w, q) {
  const g0 = game(), st = g0.st, lim = (st.limit || 20) * 1000, t0 = Date.now() - Math.min(Math.max(0, Date.now() - (st.at || Date.now())), lim);
  revealing = false;
  const hd = h('div', 'qhead'); const qn = h('span', '', 'Question ' + (st.qi + 1) + ' of ' + st.qs.length); const ans = h('span');
  hd.append(qn, ans); w.appendChild(hd);
  const bar = timerBar(); w.appendChild(bar);
  const entry = g0.entries.find(e => e.id === q.e);
  w.appendChild(factView(entry));
  w.appendChild(h('p', 'ask', askText(entry)));
  w.appendChild(optionGrid(g0, q, {}));
  const hb = h('div', 'hostbar'); const now = h('button', 'btn ghost small', 'Reveal now'); now.type = 'button';
  hb.append(now); w.appendChild(hb);
  now.addEventListener('click', () => reveal());
  Sound.question(); let lastSec = 99;
  async function reveal() {
    if (revealing) return; revealing = true;
    const s = game().st; if (s.phase !== 'play') return;
    try { await db.set('wwt-state/main', { ...s, phase: 'reveal', at: Date.now() }); } catch (e) { revealing = false; }
  }
  const tick = setInterval(() => {
    if (!document.contains(bar)) return clearInterval(tick);
    const el = Date.now() - t0; bar.firstChild.style.transform = 'scaleX(' + Math.max(0, 1 - el / lim) + ')';
    const sec = Math.ceil((lim - el) / 1000); if (sec !== lastSec && sec > 0 && sec <= 5 && !revealing) Sound.tick(sec <= 3); lastSec = sec;
    if (el >= lim) reveal();
  }, 250);
  function update() {
    const g = game();
    const eligible = g.players.filter(p => p.id !== q.a);
    const got = g.answers.filter(a => a.qi === st.qi && a.pid !== q.a);
    ans.textContent = got.length + ' of ' + eligible.length + ' answered';
    if (eligible.length && got.length >= eligible.length) setTimeout(reveal, 600);
  }
  return { update };
}

function hostReveal(w, q) {
  const g = game(), st = g.st;
  const hd = h('div', 'qhead'); hd.appendChild(h('span', '', 'Question ' + (st.qi + 1) + ' of ' + st.qs.length)); w.appendChild(hd);
  const grid = h('div', 'tv-grid'); w.appendChild(grid);
  const leftC = h('div', 'rev'); leftC.style.display = 'flex'; leftC.style.flexDirection = 'column'; leftC.style.gap = '16px';
  const entry = g.entries.find(e => e.id === q.e);
  leftC.appendChild(factView(entry));
  Sound.reveal();
  const who = h('div', 'reveal-who'); who.appendChild(h('p', 'eyebrow', revealLabel(entry))); who.appendChild(h('p', 'script', nameOf(g, q.a)));
  leftC.appendChild(who);
  const counts = {}; g.answers.filter(a => a.qi === st.qi).forEach(a => { counts[a.choice] = (counts[a.choice] || 0) + 1; });
  leftC.appendChild(optionGrid(g, q, { reveal: true, counts }));
  grid.appendChild(leftC);
  const right = h('div', 'card'); right.appendChild(h('p', 'lbl', 'Leaderboard'));
  const board = scores(g, st.qi);
  const gains = new Map(g.answers.filter(a => a.qi === st.qi).map(a => [a.pid, points(st, a, q)]));
  const ol = h('ol', 'board');
  board.slice(0, 6).forEach((r, i) => {
    const li = h('li'); li.appendChild(h('span', 'rk', String(i + 1))); li.appendChild(h('span', 'nm', r.name));
    if (gains.get(r.id)) li.appendChild(h('span', 'gain', '+' + gains.get(r.id)));
    li.appendChild(h('span', 'score', r.score.toLocaleString())); ol.appendChild(li);
  });
  right.appendChild(ol); grid.appendChild(right);
  const last = st.qi >= st.qs.length - 1;
  const hb = h('div', 'hostbar'); const end = h('button', 'btn ghost small', 'End game'); end.type = 'button';
  const next = h('button', 'btn', last ? 'See the winners' : 'Next question'); next.type = 'button';
  hb.append(end, next); w.appendChild(hb);
  next.addEventListener('click', () => advance(next));
  end.addEventListener('click', () => {
    if (armed !== 'end') { armed = 'end'; end.textContent = 'Tap again to end'; setTimeout(() => { if (armed === 'end') { armed = ''; end.textContent = 'End game'; } }, 3500); return; }
    armed = ''; db.set('wwt-state/main', { ...game().st, phase: 'done', at: Date.now() }).catch(() => {});
  });
  next.focus({ preventScroll: true });
}
async function advance(btn) {
  const st = game().st; if (st.phase !== 'reveal') return;
  if (btn) btn.disabled = true;
  const last = st.qi >= st.qs.length - 1;
  try { await db.set('wwt-state/main', last ? { ...st, phase: 'done', at: Date.now() } : { ...st, phase: 'play', qi: st.qi + 1, at: Date.now() }); }
  catch (e) { if (btn) btn.disabled = false; }
}

function hostDone(w) {
  const g = game(), st = g.st;
  w.classList.add('done-wrap');
  const board = scores(g, (st.qs || []).length - 1);
  const head = h('div', 'done-head');
  const tt = h('div'); tt.append(h('p', 'eyebrow', 'Final scores'), h('h1', '', 'And the winner is…'));
  const again = h('button', 'btn', 'Play again with new facts'); again.type = 'button';
  head.append(tt, again); w.appendChild(head);
  if (board.length > 3) {
    const also = h('div', 'also');
    board.slice(3).forEach((r, i) => { const c = h('span', 'chip'); c.append(h('span', 'rk', ordinal(i + 4)), h('span', '', r.name), h('span', 'score', r.score.toLocaleString())); also.appendChild(c); });
    w.appendChild(also);
  }
  const DL = { 3: 0.5, 2: 1.7, 1: 3.1 };
  const pod = h('div', 'podium2');
  [2, 1, 3].forEach(place => {
    const r = board[place - 1]; const col = h('div', 'pcol p' + place + (r ? '' : ' empty')); col.style.setProperty('--dl', DL[place] + 's');
    const who = h('div', 'who');
    if (r) {
      if (place === 1) { who.appendChild(h('div', 'rays')); who.appendChild(h('div', 'star', '★')); }
      const e = h('div', 'elfstand ' + (place === 1 ? 'cheer' : 'wave')); e.innerHTML = elfSVG(r.id); who.appendChild(e);
      who.append(h('p', 'nm', r.name), h('p', 'pts', r.score.toLocaleString() + ' pts'));
    }
    const blk = h('div', 'blk', ordinal(place));
    col.append(who, blk); pod.appendChild(col);
  });
  w.appendChild(pod);
  again.addEventListener('click', () => {
    if (armed !== 'again') { armed = 'again'; again.textContent = 'Tap again: this clears everyone’s facts'; setTimeout(() => { if (armed === 'again') { armed = ''; again.textContent = 'Play again with new facts'; } }, 3500); return; }
    armed = ''; Confetti.rain(false); newGame(again);
  });
  Sound.theme(null); Sound.drumroll(3.1);
  const t = setTimeout(() => { if (!document.contains(pod)) return; Sound.fanfare(); Confetti.burst(220); Confetti.rain(true); setTimeout(() => { if (document.contains(pod)) Sound.theme('done'); }, 2200); }, 3400);
}

document.addEventListener('keydown', e => {
  if (!HOST || e.target.matches('input,textarea,select')) return;
  if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'Enter') {
    const st = (game().st || {});
    if (st.phase === 'reveal' && !e.target.matches('button')) { e.preventDefault(); advance(); }
  }
});

/* ---------- snow ---------- */
(function scene() {
  const cv = $('#snow'), ctx = cv.getContext('2d'), still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w = 0, ht = 0, trees = [];
  const fl = Array.from({ length: 60 }, () => ({ x: Math.random(), y: Math.random(), r: 1 + Math.random() * 2.4, v: 0.0006 + Math.random() * 0.0012, p: Math.random() * 6.3 }));
  const size = () => {
    const r = Math.min(devicePixelRatio || 1, 2); w = innerWidth; ht = innerHeight; cv.width = w * r; cv.height = ht * r; ctx.setTransform(r, 0, 0, r, 0, 0);
    let x = 7; const rnd = () => (x = (x * 48271) % 2147483647) / 2147483647;
    const n = Math.max(6, Math.round(w / 150)); trees = [];
    for (let i = 0; i < n; i++) trees.push({ x: (i + 0.5) / n * w + (rnd() - 0.5) * (w / n) * 0.7, s: 0.55 + rnd() * 0.8, far: i % 3 === 1 });
  };
  const tree = (x, base, hs, dark) => {
    ctx.fillStyle = dark ? '#2E4F4B' : '#5F8A84';
    for (let k = 0; k < 3; k++) { const tier = base - hs * 0.22 * k, half = hs * (0.42 - 0.1 * k); ctx.beginPath(); ctx.moveTo(x - half, tier); ctx.lineTo(x, tier - hs * 0.45); ctx.lineTo(x + half, tier); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = '#FFFFFF';
    for (let k = 0; k < 3; k++) { const tier = base - hs * 0.22 * k, half = hs * (0.42 - 0.1 * k); ctx.beginPath(); ctx.moveTo(x - half * 0.75, tier - hs * 0.05); ctx.quadraticCurveTo(x, tier - hs * 0.16, x + half * 0.75, tier - hs * 0.05); ctx.quadraticCurveTo(x, tier + hs * 0.02, x - half * 0.75, tier - hs * 0.05); ctx.fill(); }
    ctx.fillStyle = '#7A4A3A'; ctx.fillRect(x - hs * 0.04, base, hs * 0.08, hs * 0.12);
  };
  const ground = () => {
    const g = ht * 0.88, unit = Math.min(w, ht);
    trees.filter(t => t.far).forEach(t => tree(t.x, g - 2, unit * 0.12 * t.s, false));
    trees.filter(t => !t.far).forEach(t => tree(t.x, g + 4, unit * 0.17 * t.s, true));
    ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.moveTo(0, g + 10);
    for (let x = 0; x <= w + 20; x += 20) ctx.lineTo(x, g + 8 + Math.sin(x / 160) * 6 + Math.cos(x / 53) * 3);
    ctx.lineTo(w, ht); ctx.lineTo(0, ht); ctx.closePath(); ctx.fill();
  };
  size(); addEventListener('resize', size);
  const frame = () => {
    ctx.clearRect(0, 0, w, ht);
    if (HOST && document.body.dataset.scene === 'full') ground();
    ctx.fillStyle = '#fff';
    for (const f of fl) { if (!still) { f.y += f.v; f.p += 0.01; if (f.y > 1.02) { f.y = -0.02; f.x = Math.random(); } } ctx.globalAlpha = 0.6; ctx.beginPath(); ctx.arc(f.x * w + Math.sin(f.p) * 8, f.y * ht, f.r, 0, 6.2832); ctx.fill(); }
    ctx.globalAlpha = 1;
    if (!still) requestAnimationFrame(frame); else setTimeout(frame, 1000);
  };
  frame();
})();

/* ---------- go ---------- */
const render = () => { try { (HOST ? hostRender : playerRender)(); } catch (e) { console.error(e); } };
let rq = false; db.onChange(() => { if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; render(); }); });
setTimeout(() => { if (!db.loaded) setStatus("Can't reach the game yet. Keep this page open; it keeps trying.", true); }, 10000);
db.start();
})();
