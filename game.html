<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Who Wrote This?</title>
<style>
@font-face{font-family:"Figtree";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/figtree-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/figtree-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/figtree-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Caveat Brush";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/caveat-brush-latin-400-normal.woff2) format("woff2")}
:root{
  /* One world for TV and phones, taken from the party deck: peach sky, coral brush script, teal text.
     Answer tiles use four fixed colours with a symbol each, the same order on the TV and every phone. */
  color-scheme:light;
  --peach:#FBE6DC; --card:#FFF7F2; --coral:#E8553E; --teal:#2F5F5A; --muted:#5E7774; --line:#EBCDBF;
  --o1:#D9452E; --o2:#2F6B64; --o3:#A86B0A; --o4:#5A4A8C; --good:#2F7D4F;
  --script:"Caveat Brush","Figtree",cursive; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--peach);color:var(--teal);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,textarea{font:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:relative;z-index:3;min-height:100%;display:flex;flex-direction:column}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:16px}
.tv .wrap{max-width:1500px;padding:clamp(16px,3vmin,40px) clamp(16px,4vmin,56px)}
h1,.script{font-family:var(--script);font-weight:400;color:var(--coral);margin:0;line-height:1;transform:rotate(-1.5deg)}
h1{font-size:clamp(2.6rem,11vw,3.6rem)}
.tv h1{font-size:clamp(3rem,9vmin,7rem)}
.eyebrow{margin:0;font-size:.8rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.tv .eyebrow{font-size:clamp(.9rem,2vmin,1.4rem)}
p{margin:0}
.lead{font-size:1.05rem}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{appearance:none;border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:1rem;cursor:pointer;background:var(--coral);color:#fff;min-height:48px}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--teal);border:2px solid var(--teal)}
.btn.small{padding:8px 12px;min-height:36px;font-size:.9rem}
.btn.quiet{background:transparent;color:var(--muted);text-decoration:underline;padding:8px;min-height:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.lbl{font-weight:700;font-size:.85rem;letter-spacing:.04em}
input[type="text"],textarea{width:100%;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--teal);padding:12px 14px;font-size:1.05rem}
input[type="text"]:focus,textarea:focus{border-color:var(--teal);outline:none}
textarea{resize:vertical;min-height:90px}
.count{font-size:.8rem;color:var(--muted);text-align:right}
.err{color:var(--o1);font-weight:600;font-size:.92rem}
.seg{display:flex;background:#fff;border:2px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff}
.entry{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.entry .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.entry img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none;background:var(--line)}
.slot-n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.85rem;background:#fff;border:1px solid var(--line)}
.pill.ok{background:var(--good);color:#fff;border-color:var(--good)}
.status{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:5;font-size:.8rem;font-weight:600;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 11px;color:var(--muted)}
.status.bad{color:var(--o1);border-color:var(--o1)}

/* question + options */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.timer{height:8px;border-radius:999px;background:#fff;overflow:hidden;border:1px solid var(--line)}
.timer i{display:block;height:100%;width:100%;background:var(--coral);transform-origin:left;transition:transform .25s linear}
.fact{background:#fff;border-radius:18px;padding:18px 20px;font-size:1.25rem;font-weight:600;line-height:1.35;text-align:center;overflow-wrap:anywhere;border:1px solid var(--line)}
.fact::before{content:"\201C"}.fact::after{content:"\201D"}
.fact.photo::before,.fact.photo::after{content:none}
.photo-box{background:#fff;border:6px solid #fff;border-bottom-width:28px;border-radius:6px;box-shadow:0 6px 20px rgba(80,40,20,.18);align-self:center;transform:rotate(-2deg);max-width:100%}
.photo-box img{display:block;max-width:100%;height:34vh;width:auto;min-width:24vh;object-fit:contain;background:#F3E3DA}
.tv .photo-box img{height:40vh;min-width:30vh}
.tv .rev .photo-box img{height:30vh;min-width:22vh}
.tv .rev .fact{font-size:clamp(1.2rem,3.4vmin,2.4rem)}
.ask{text-align:center;font-family:var(--script);font-size:2rem;color:var(--coral);line-height:1}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;border:0;border-radius:14px;color:#fff;font-weight:700;font-size:1.1rem;padding:18px 12px 18px 44px;text-align:left;min-height:72px;cursor:pointer;overflow-wrap:anywhere;display:flex;align-items:center;line-height:1.2}
.opt::before{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:1.15rem}
.opt.c0{background:var(--o1)}.opt.c0::before{content:"\2605"}
.opt.c1{background:var(--o2)}.opt.c1::before{content:"\25CF"}
.opt.c2{background:var(--o3)}.opt.c2::before{content:"\25B2"}
.opt.c3{background:var(--o4)}.opt.c3::before{content:"\25C6"}
.opt:disabled{cursor:default}
.opts.locked .opt:not(.picked){opacity:.3}
.opt.picked{outline:4px solid var(--teal);outline-offset:3px}
.opts.reveal .opt:not(.right){opacity:.28}
.opt.right{outline:4px solid var(--good);outline-offset:3px}
.opt .n{margin-left:auto;padding-left:10px;font-size:1.3em;font-variant-numeric:tabular-nums}
.intro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(10px,2.2vmin,24px);max-width:1000px;margin:0 auto}
.intro .lead{margin:0}
.intro .btn,.intro .btn.huge{align-self:center;margin-left:auto;margin-right:auto}
.tv .intro .lead{font-size:clamp(1.1rem,3vmin,2rem)}
.tv .intro .lead.big{font-family:var(--script);color:var(--coral);font-size:clamp(2rem,7vmin,4.6rem);line-height:1}
.verse{margin:0;max-width:900px;text-align:center;font-style:italic;font-size:1.05rem;line-height:1.45}
.verse p{margin:0}
.verse cite{display:block;margin-top:.5em;font-style:normal;font-weight:700;font-size:.8em;letter-spacing:.04em}
.tv .verse{font-size:clamp(1.1rem,3.2vmin,2.2rem)}
.manger{display:flex;justify-content:center}
.manger svg{height:150px;width:auto}
.tv .manger svg{height:clamp(110px,26vh,300px)}
.big-msg{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;padding:18px 8px}
.big-msg .script{font-size:2.6rem}
.score{font-variant-numeric:tabular-nums;font-weight:700}

/* TV */
.tv-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(16px,3vmin,40px);align-items:start}
.qr{background:var(--peach);width:clamp(200px,44vmin,470px);aspect-ratio:1}
.joinbox{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.lobby-head{text-align:center}
.lobby-head h1{display:inline-block}
.lobby-grid{align-items:center;max-width:1300px;width:100%;margin:0 auto}
.qr svg{display:block;width:100%;height:100%}
.joinurl{font-weight:700;font-size:clamp(1rem,2.4vmin,1.6rem);overflow-wrap:anywhere}
.players{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:clamp(.95rem,2vmin,1.3rem)}
.chip .dots{letter-spacing:2px;color:var(--coral)}
.chip.ready{border-color:var(--good)}
.chip .tick{color:var(--good)}
.tv .fact{font-size:clamp(1.6rem,5.2vmin,3.6rem);padding:clamp(18px,3.5vmin,44px)}
.tv .ask{font-size:clamp(2.2rem,6vmin,4.5rem)}
.tv .opts{gap:clamp(10px,1.8vmin,22px)}
.tv .opt{font-size:clamp(1.3rem,3.6vmin,2.6rem);min-height:clamp(70px,12vmin,140px);padding-left:clamp(44px,6vmin,80px)}
.tv .opt::before{left:clamp(14px,2vmin,26px);font-size:1em}
.tv .timer{height:clamp(8px,1.4vmin,16px)}
.tv .qhead{font-size:clamp(1rem,2.6vmin,1.8rem);font-weight:700}
.reveal-who{text-align:center}
.reveal-who .script{font-size:clamp(2.6rem,8vmin,6.5rem)}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.board li{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;font-size:clamp(1rem,2.4vmin,1.7rem)}
.board .rk{width:1.8em;color:var(--coral);font-variant-numeric:tabular-nums}
.board .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .gain{color:var(--good);font-size:.8em;font-variant-numeric:tabular-nums}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:clamp(8px,2vmin,24px);max-width:900px;margin:0 auto;width:100%}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.pod .nm{font-weight:700;font-size:clamp(1.1rem,3vmin,2.2rem);overflow-wrap:anywhere}
.pod .blk{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:center;color:#fff;font-family:var(--script);font-size:clamp(2.4rem,7vmin,5rem)}
.pod.p1 .blk{height:clamp(140px,26vmin,300px);background:var(--o1)}
.pod.p2 .blk{height:clamp(100px,18vmin,210px);background:var(--o2)}
.pod.p3 .blk{height:clamp(70px,12vmin,140px);background:var(--o3)}
.hostbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.hostbar .grow{flex:1}
select{font:inherit;border:2px solid var(--line);border-radius:10px;padding:8px;background:#fff;color:var(--teal)}
/* garland of lights */
#garland{position:fixed;left:0;right:0;top:0;height:52px;pointer-events:none;z-index:3}
#garland svg{display:block;width:100%;height:100%}
.bulb{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}
.wrap{padding-top:58px}
.tv .wrap{padding-top:clamp(56px,8vmin,80px)}
/* scene: cottage + elves + ground (TV start, lobby, winners) */
#cottage{position:fixed;right:5vw;bottom:3.5vh;width:clamp(130px,22vmin,260px);z-index:1;pointer-events:none;display:none}
body[data-scene="full"] #cottage{display:block}
body[data-screen="done"] #cottage{display:none!important}
.pcol .nm{text-shadow:0 0 4px var(--peach),0 0 8px var(--peach),0 0 12px var(--peach)}
body.tv[data-scene="full"] .wrap{padding-bottom:20vh}
.smoke{animation:smoke 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.smoke.s2{animation-delay:1.3s}.smoke.s3{animation-delay:2.6s}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:.8}100%{transform:translate(-14px,-46px) scale(1.6);opacity:0}}
#elves{position:fixed;left:0;right:0;bottom:0;height:30vh;pointer-events:none;z-index:2;overflow:hidden}
#garland{z-index:4}
.elf{position:absolute;left:0;bottom:var(--y);width:var(--w);animation:stroll var(--d) linear infinite;animation-delay:var(--dl)}
.elf .flip{animation:face var(--d) step-end infinite;animation-delay:var(--dl)}
.elf .pop{position:relative}
.elf.new .pop{animation:pop .7s cubic-bezier(.3,1.7,.5,1)}
@keyframes stroll{0%{transform:translateX(var(--a))}50%{transform:translateX(var(--b))}100%{transform:translateX(var(--a))}}
@keyframes face{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
@keyframes pop{0%{transform:translateY(40px) scale(.2)}100%{transform:none}}
.elf .tag{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:2px;background:#fff;color:var(--teal);border:2px solid var(--line);border-radius:999px;padding:2px 10px;font-weight:700;font-size:clamp(.75rem,1.7vmin,1.05rem);white-space:nowrap}
.elf .tag.ready{border-color:var(--good);color:var(--good)}
.elf-svg{display:block;width:100%;height:auto;overflow:visible;transform-origin:50% 96%;animation:tilt .8s ease-in-out infinite alternate}
@keyframes tilt{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.still .elf-svg{animation:none!important}
.cheer .elf-svg{animation:hop .9s ease-in-out infinite}
@keyframes hop{0%{transform:translateY(0) rotate(-6deg)}25%{transform:translateY(-14%) rotate(0)}50%{transform:translateY(0) rotate(6deg)}75%{transform:translateY(-14%) rotate(0)}100%{transform:translateY(0) rotate(-6deg)}}
.wave .elf-svg{animation:tilt 1.4s ease-in-out infinite alternate}
.me-elf{display:flex;align-items:center;gap:12px}
.builder{display:flex;flex-direction:column;gap:12px}
.builder .preview{width:110px;align-self:center}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kind button{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:3px solid var(--line);border-radius:14px;padding:8px 6px 10px;font-weight:700;color:var(--teal);cursor:pointer}
.kind .gicon{display:block;width:44px;height:44px}.kind .gicon svg{display:block;width:100%;height:100%}
.kind .k-m .gicon{color:#1E7A9A}.kind .k-f .gicon{color:#C2185B}
.kind button[aria-pressed="true"]{border-color:var(--coral);background:#FFF1EC}
.swrow{display:flex;flex-direction:column;gap:6px}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--teal)}
.acc{border:2px solid var(--line);background:#fff;color:var(--teal);border-radius:999px;padding:6px 12px;font-weight:700;cursor:pointer}
.acc[aria-pressed="true"]{border-color:var(--teal);background:var(--teal);color:#fff}
.me-elf .pic{width:64px;flex:none}
/* host start screen */
.hero{display:flex;flex-direction:column;gap:clamp(10px,2vmin,22px);max-width:980px}
.hero h1{font-size:clamp(3.4rem,13vmin,10rem)}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,2vmin,20px)}
.step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(12px,2vmin,20px);display:flex;flex-direction:column;gap:6px}
.step .n{font-family:var(--script);color:var(--coral);font-size:clamp(2rem,5vmin,3.2rem);line-height:1}
.step p{font-size:clamp(.95rem,2vmin,1.3rem);font-weight:600}
.btn.huge{font-size:clamp(1.1rem,2.6vmin,1.7rem);padding:clamp(14px,2.2vmin,22px) clamp(22px,3.4vmin,40px);align-self:flex-start;border-radius:16px;box-shadow:0 6px 0 #B83A26;transition:transform .1s}
.btn.huge:active{transform:translateY(4px);box-shadow:0 2px 0 #B83A26}
#music{position:fixed;bottom:12px;left:12px;z-index:6;font-size:.85rem;background:#fff;color:var(--teal);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer}
body[data-screen="done"] #music{bottom:auto;left:auto;right:clamp(16px,3vmin,40px);top:clamp(112px,17vmin,170px)}
#music[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
/* winners */
.done-wrap{min-height:100vh;min-height:100dvh}
.done-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.done-head h1{font-size:clamp(2.6rem,8vmin,6rem)}
.also{display:flex;flex-wrap:wrap;gap:8px}
.podium2{margin-top:auto;display:grid;align-items:end;gap:clamp(6px,1.4vmin,20px);width:100%;max-width:min(80%,calc(var(--n) * 200px));align-self:center}
.pcol{display:flex;flex-direction:column;align-items:center}
.pcol .who{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;animation:whoIn .7s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--dl) + .55s)}
@keyframes whoIn{from{opacity:0;transform:translateY(30px) scale(.6)}to{opacity:1;transform:none}}
.pcol .elfstand{width:clamp(34px,var(--elf),120px);position:relative;z-index:1}
.pcol.p1 .elfstand{width:clamp(56px,calc(var(--elf) * 1.35),160px)}
.pcol .nm{font-family:var(--script);color:var(--coral);font-size:clamp(1rem,var(--nm),3.6rem);max-width:100%;line-height:1;text-align:center;overflow-wrap:anywhere;position:relative;z-index:1}
.pcol .pts{font-weight:700;font-variant-numeric:tabular-nums;font-size:clamp(.75rem,calc(var(--nm) * .45),1.5rem);white-space:nowrap;background:#fff;border-radius:999px;padding:2px 12px;border:1px solid var(--line);position:relative;z-index:1}
.pcol .blk{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:center;color:#fff;font-family:var(--script);font-size:clamp(1.2rem,calc(var(--nm) * 1.5),6rem);transform-origin:bottom;animation:rise .8s cubic-bezier(.2,1.2,.4,1) both;animation-delay:var(--dl);box-shadow:inset 0 -10px 0 rgba(0,0,0,.12);margin-top:6px}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.pcol.p1 .blk{height:clamp(100px,19vmin,230px);background:var(--o1)}
.pcol.p1 .nm{font-size:clamp(1.4rem,calc(var(--nm) * 1.3),4.2rem)}
.pcol.rest .blk{height:clamp(44px,7vmin,96px)}
.podium2.crowd{max-width:98%;gap:clamp(2px,.5vmin,8px)}
.crowd .pcol.rest .nm{font-size:clamp(.72rem,var(--nm),1.4rem);line-height:1.05;word-break:normal;overflow-wrap:normal;hyphens:none;background:rgba(255,247,242,.94);border-radius:6px;padding:2px 4px;text-shadow:none}
.crowd .pcol.rest .pts{background:rgba(255,247,242,.94);border:0;border-radius:6px;padding:0 4px;margin-top:2px;font-size:clamp(.62rem,calc(var(--nm) * .62),1rem)}
.crowd .pcol.rest .pts::after{content:""}
.crowd .pcol.p1 .elfstand{width:clamp(56px,11vmin,150px)}
.crowd .pcol.p1 .nm{font-size:clamp(1.4rem,4.4vmin,3.6rem)}
.crowd .pcol.p1 .pts{font-size:clamp(.9rem,2.2vmin,1.5rem)}
.crowd .pcol.p1 .blk{font-size:clamp(2rem,7vmin,5rem)}
.pcol.c2 .blk{background:var(--o2)}.pcol.c0 .blk{background:var(--o3)}.pcol.c1 .blk{background:var(--o4)}
.star{font-size:clamp(2rem,6vmin,4.4rem);color:#E2B452;line-height:1;animation:glow 1.4s ease-in-out infinite alternate;text-shadow:0 0 18px rgba(226,180,82,.8);position:relative;z-index:1}
@keyframes glow{from{transform:scale(.9) rotate(-8deg)}to{transform:scale(1.12) rotate(8deg)}}
.rays{position:absolute;left:50%;top:40%;width:clamp(220px,46vmin,520px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.75) 0 10deg,rgba(255,255,255,0) 10deg 20deg);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:spin 14s linear infinite;z-index:0}

<script>
const SUPABASE_URL = 'https://rwlpcqdyrwatpspkqaau.supabase.co';
const SUPABASE_KEY = 'sb_publishable_845xXlvOeSXYYHaDRjVLEA_qnVl14cS';
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const txt = v => (v == null ? '' : String(v)).trim();
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const HOST = location.hash === '#host';
const MAX_ENTRIES = 1, MAX_CHARS = 160;  // one baby photo each
if (HOST) document.body.classList.add('tv');

/* ---------- local identity ---------- */
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
let PID = ls.get('wwt_pid');
if (!PID) { PID = rid(); ls.set('wwt_pid', PID); }

/* ---------- store ----------
   One state row (wwt-state/main) names the current game id (gid). Everything else for a game lives under
   wwt-<gid>-player/…, wwt-<gid>-entry/…, wwt-<gid>-answer/…, so starting a new game never deletes rows.
   The TV listens to every change; phones only listen to the state row and fetch the rest when it changes,
   which keeps realtime traffic low with a full room. Photos live in party_photos and are fetched on demand. */
const STATE = 'wwt-state/main';
function makeStore() {
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
  const T = 'party_docs';
  const cache = new Map(), photos = new Map(), listeners = [], touched = new Map();
  let loaded = false, live = false, fails = 0, busy = false, again = false, pending = 0;
  const gidNow = () => { const st = cache.get(STATE); return st && st.gid ? String(st.gid) : ''; };
  const mine = path => path === STATE || (gidNow() && path.startsWith('wwt-' + gidNow() + '-'));
  const emit = () => { if (loaded) listeners.forEach(f => f()); };
  let cur = null;
  function refresh() {
    if (busy) { again = true; return cur; }
    busy = true;
    cur = cycle();
    return cur;
  }
  async function cycle() {
    try {
      do {
        again = false;
        const t0 = Date.now();
        const r1 = await sb.from(T).select('path,data').eq('path', STATE);
        if (r1.error) throw r1.error;
        let rows = r1.data || [];
        const stRow = rows.find(r => r.path === STATE), gid = stRow && stRow.data && stRow.data.gid ? String(stRow.data.gid) : '';
        if (gid) {
          // the server hands back at most 1000 rows at a time, and a 22-player game can pass that
          for (let from = 0; ; from += 1000) {
            const r2 = await sb.from(T).select('path,data').like('path', 'wwt-' + gid + '-%').order('path').range(from, from + 999);
            if (r2.error) { if (from > 0 && (r2.status === 416 || r2.error.code === 'PGRST103')) break; throw r2.error; }
            const got = r2.data || [];
            rows = rows.concat(got);
            if (got.length < 1000) break;
          }
        }
        // anything written or pushed to us after this fetch started is newer than what it returned
        const fresh = p => (touched.get(p) || 0) < t0;
        let changed = !loaded; const seen = new Set();
        for (const r of rows) {
          seen.add(r.path);
          if (!fresh(r.path)) continue;
          const old = cache.get(r.path), now = r.data || {};
          if (!old || JSON.stringify(old) !== JSON.stringify(now)) { cache.set(r.path, now); changed = true; }
        }
        for (const p of [...cache.keys()]) if (!seen.has(p) && fresh(p) && !pending) { cache.delete(p); changed = true; }
        loaded = true; fails = 0; setStatus('');
        if (changed) emit();
      } while (again);
    } finally { busy = false; }
  }
  const safe = () => refresh().catch(() => { if (++fails >= 2) setStatus("Can't reach the game. Check your connection; this page keeps trying.", true); });
  function onChange(p) {
    const row = p.eventType === 'DELETE' ? p.old : p.new;
    if (!row || !row.path || !loaded) return;
    const path = row.path;
    if (path === STATE) {
      const before = gidNow();
      touched.set(path, Date.now()); cache.set(path, row.data || {}); emit();
      // a new phase or a new game: fetch the rest (players, entries, answers) once
      if (!HOST || gidNow() !== before) safe();
      return;
    }
    if (!mine(path)) return;
    touched.set(path, Date.now());
    if (p.eventType === 'DELETE') cache.delete(path); else cache.set(path, row.data || {});
    emit();
  }
  async function run(path, fn) {
    pending++; if (path) touched.set(path, Date.now());
    try {
      // party wifi drops out now and then: try a write four times before giving up
      for (let i = 0; ; i++) {
        let error;
        try { ({ error } = await fn()); } catch (x) { error = x; }
        // a retried insert that had already landed comes back as a duplicate: that's a success
        if (!error || error.code === '23505' || /duplicate/i.test(error.message || '')) break;
        if (i >= 3) throw error;
        await new Promise(r => setTimeout(r, [400, 900, 1800][i]));
      }
      setStatus('');
    }
    catch (e) { setStatus("Couldn't save. Check your connection and try again.", true); throw e; }
    finally { pending--; if (path) touched.set(path, Date.now()); }
  }
  const chains = new Map();
  function inOrder(path, job) {
    const prev = chains.get(path) || Promise.resolve();
    const next = prev.catch(() => {}).then(job);
    chains.set(path, next);
    next.catch(() => {}).then(() => { if (chains.get(path) === next) chains.delete(path); });
    return next;
  }
  function start() {
    safe();
    let ch = null;
    function subscribe() {
      try {
        if (ch) { const old = ch; ch = null; live = false; sb.removeChannel(old).catch(() => {}); }
        const filter = HOST ? { event: '*', schema: 'public', table: T } : { event: '*', schema: 'public', table: T, filter: 'path=eq.' + STATE };
        const me = sb.channel('wwt-' + rid()).on('postgres_changes', filter, onChange);
        ch = me;
        me.subscribe(st => { if (ch !== me) return; const was = live; live = st === 'SUBSCRIBED'; if (live && !was) safe(); });
      } catch (e) { live = false; }
    }
    subscribe();
    let n = 0, misses = 0;
    // a phone's live connection can die silently (sleep, wifi switch), so phones also check the one
    // small game-state row every 2s and fetch everything else only when it moved on
    let peeking = false;
    async function peek(retry) {
      if (peeking || busy) return; peeking = true;
      const t0 = Date.now();
      try {
        const r = await sb.from(T).select('path,data').eq('path', STATE);
        if (r.error) throw r.error;
        const row = (r.data || [])[0], now = row ? row.data || {} : null, old = cache.get(STATE);
        if (JSON.stringify(now) !== JSON.stringify(old || null) && (touched.get(STATE) || 0) < t0) {
          // the live connection missed this: show it now, fetch the rest, and after two misses reconnect
          if (now) { touched.set(STATE, Date.now()); cache.set(STATE, now); emit(); }
          safe();
          if (live && ++misses >= 2) { misses = 0; subscribe(); }
        }
        fails = 0; setStatus('');
      } catch (e) {
        if (++fails >= 2) setStatus("Can't reach the game. Check your connection; this page keeps trying.", true);
        if (!retry) setTimeout(() => peek(true), 500);
      }
      finally { peeking = false; }
    }
    setInterval(() => {
      n++; if (document.hidden && !HOST) return;
      if (!live || n % 4 === 0) safe(); else if (!HOST) peek();
    }, 2000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) safe(); });
    addEventListener('online', safe);
  }
  return {
    start, refresh: safe, onChange: f => listeners.push(f), get loaded() { return loaded; },
    get: path => cache.get(path),
    gp: kind => 'wwt-' + gidNow() + '-' + kind + '/',
    list: prefix => [...cache.entries()].filter(([p]) => p.startsWith(prefix)).map(([p, d]) => ({ ...d, id: p.slice(prefix.length) })),
    set(path, data) {
      const d = { ...data }, had = cache.has(path), old = cache.get(path);
      touched.set(path, Date.now()); cache.set(path, d); emit();
      // if it never saved, put the screen back the way it was so nobody thinks it did
      return inOrder(path, () => run(path, () => sb.from(T).upsert({ path, data: d })))
        .catch(e => { if (cache.get(path) === d) { if (had) cache.set(path, old); else cache.delete(path); emit(); } throw e; });
    },
    del(path) {
      const had = cache.has(path), old = cache.get(path);
      touched.set(path, Date.now()); cache.delete(path); emit();
      return inOrder(path, () => run(path, () => sb.from(T).delete().eq('path', path)))
        .catch(e => { if (had && !cache.has(path)) { cache.set(path, old); emit(); } throw e; });
    },
    async putPhoto(id, gid, data) { photos.set(id, data); await run(null, () => sb.from('party_photos').insert({ id, gid, data })); },
    async getPhoto(id) {
      if (photos.has(id)) return photos.get(id);
      for (let i = 0; i < 3; i++) {
        const { data, error } = await sb.from('party_photos').select('data').eq('id', id);
        if (!error && data && data.length) { photos.set(id, data[0].data); return data[0].data; }
        await new Promise(r => setTimeout(r, 700));
      }
      return null;
    },
    delPhoto(id) { photos.delete(id); return run(null, () => sb.from('party_photos').delete().eq('id', id)); },
    clearPhotosExcept(gid) { return run(null, () => sb.from('party_photos').delete().neq('gid', gid)); },
  };
}

let statusT = 0;
function setStatus(msg, bad) {
  const el = $('#status'); clearTimeout(statusT);
  if (!msg) { el.hidden = true; return; }
  el.hidden = false; el.textContent = msg; el.classList.toggle('bad', !!bad);
  if (!bad) statusT = setTimeout(() => { el.hidden = true; }, 2500);
}

const db = makeStore();

/* ---------- derived game data ---------- */
function game() {
  const st = db.get(STATE) || null;
  if (!st || !st.gid) return { st: null, players: [], entries: [], answers: [] };
  const gid = st.gid;
  const players = db.list(db.gp('player')).filter(p => txt(p.name)).sort((a, b) => (a.t || 0) - (b.t || 0));
  const entries = db.list(db.gp('entry')).sort((a, b) => (a.t || 0) - (b.t || 0));
  const answers = db.list(db.gp('answer'));
  return { st, gid, players, entries, answers };
}
const nameOf = (g, pid) => { const p = g.players.find(x => x.id === pid); return p ? txt(p.name) : 'Someone'; };
function points(st, a, q) {
  if (!q || a.choice !== q.a) return 0;
  const lim = (st.limit || 20) * 1000;
  if (Number(a.ms) > lim + 1500) return 0;
  return 500 + Math.round(500 * Math.max(0, 1 - (Number(a.ms) || lim) / lim));
}
function scores(g, uptoQi) {
  const s = new Map(g.players.map(p => [p.id, 0]));
  (g.st.qs || []).forEach((q, qi) => {
    if (qi > uptoQi) return;
    g.answers.filter(a => a.qi === qi).forEach(a => s.set(a.pid, (s.get(a.pid) || 0) + points(g.st, a, q)));
  });
  return g.players.map(p => ({ id: p.id, name: txt(p.name), score: s.get(p.id) || 0 })).sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
}
// the last question whose points count: during 'play' the current one is still open
const scoredUpTo = st => st.phase === 'play' ? st.qi - 1 : st.qi;
// a short fingerprint of the final results: the winners screens are rebuilt only if it changes
const boardSig = g => scores(g, (g.st.qs || []).length - 1).map(r => r.id + ':' + r.score + ':' + r.name).join('|');
const rankOf = (board, pid) => { const i = board.findIndex(r => r.id === pid); return i < 0 ? null : i + 1; };
const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');

/* ---------- shared bits ---------- */
async function fillPhoto(box, id) {

  const data = await db.getPhoto(id);
  if (data) img.src = data; else { frame.replaceWith(h('p', 'fact photo', 'The photo could not be loaded.')); }
}

  if (entry && entry.kind === 'photo' && entry.photo) fillPhoto(box, entry.photo);
  else box.appendChild(h('p', 'fact', entry ? txt(entry.text) : ''));
  return box;
}
function optionGrid(g, q, { pick, picked, reveal, counts, label }) {
  const grid = h('div', 'opts' + (reveal ? ' reveal' : picked ? ' locked' : ''));
  q.o.forEach((pid, i) => {
    const b = h('button', 'opt c' + i); b.type = 'button';
    b.appendChild(h('span', '', label ? label(pid) : nameOf(g, pid)));
    if (counts) b.appendChild(h('span', 'n', String(counts[pid] || 0)));
    if (reveal && pid === q.a) b.classList.add('right');
    if (picked === pid) b.classList.add('picked');
    if (!pick || picked || reveal) b.disabled = true;
    else b.addEventListener('click', () => pick(pid));
    grid.appendChild(b);
  });
  return grid;
}
function timerBar() { const t = h('div', 'timer'); t.appendChild(h('i')); return t; }

const elfLayer = $('#elves'), elfMap = new Map();
function syncElves(list, { sound = false } = {}) {
  const W = innerWidth, keep = new Set(list.map(x => x.id));
  for (const [id, el] of elfMap) if (!keep.has(id)) { el.remove(); elfMap.delete(id); }
  list.forEach((x, i) => {
    let el = elfMap.get(x.id);
    if (!el) {
      const n = hashN(x.id), w = Math.round(Math.min(Math.max(W, 600), 2200) * 0.05 + 22);
      const a = Math.round(W * 0.02 + (n % 97) / 97 * W * 0.12), b = Math.round(W - w - 20 - ((n >>> 5) % 89) / 89 * W * 0.14);
      const speed = 45 + (n % 40), d = (2 * Math.max(200, b - a) / speed).toFixed(1);
      el = h('div', 'elf'); el.style.setProperty('--w', w + 'px'); el.style.setProperty('--a', a + 'px'); el.style.setProperty('--b', b + 'px');
      el.style.setProperty('--d', d + 's'); el.style.setProperty('--dl', (-(n % 1000) / 1000 * d).toFixed(1) + 's');
      const y = 0.6 + ((n >>> 9) % 40) / 10; el.style.setProperty('--y', y + 'vh'); el.style.zIndex = String(100 - Math.round(y * 10));
      const pop = h('div', 'pop'); const tag = h('span', 'tag'); const flip = h('div', 'flip');
      pop.append(tag, flip); el.appendChild(pop); elfLayer.appendChild(el); elfMap.set(x.id, el);
      if (sound) { el.classList.add('new'); Sound.join(); setTimeout(() => el.classList.remove('new'), 800); }
    }
    const lk = JSON.stringify(x.look || null), flipEl = el.querySelector('.flip');
    if (el.dataset.look !== lk) { el.dataset.look = lk; swapElf(flipEl, elfSVG(x.seed || x.id, x.look)); }
    const tag = el.querySelector('.tag');
    tag.hidden = !x.name; tag.textContent = x.name ? x.name + (x.ready ? ' ✓' : '') : ''; tag.classList.toggle('ready', !!x.ready);

}

/* ---------- confetti ---------- */
const Confetti = (() => {
  const cv = $('#confetti'), cx = cv.getContext('2d'), cols = ['#E8553E', '#E2B452', '#2F9E8A', '#5A4A8C', '#FFFFFF', '#C2185B', '#3E7D3A'];
  let parts = [], raf = 0, trickle = false;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const size = () => { const r = Math.min(devicePixelRatio || 1, 2); cv.width = innerWidth * r; cv.height = innerHeight * r; cx.setTransform(r, 0, 0, r, 0, 0); };
  size(); addEventListener('resize', size);
  const piece = (x, y, vx, vy) => ({ x, y, vx, vy, w: 6 + Math.random() * 6, rot: Math.random() * 6.3, vr: (Math.random() - 0.5) * 0.3, c: cols[Math.floor(Math.random() * cols.length)] });
  function run() {
    if (raf || still) return;
    const step = () => {
      cx.clearRect(0, 0, innerWidth, innerHeight);
      if (trickle && Math.random() < 0.35) parts.push(piece(Math.random() * innerWidth, -12, (Math.random() - 0.5), 1 + Math.random() * 1.5));
      parts = parts.filter(p => p.y < innerHeight + 30);
      for (const p of parts) {
        p.vy = Math.min(p.vy + 0.22, 3.2 + p.w * 0.1); p.vx *= 0.985; p.x += p.vx + Math.sin(p.rot) * 0.6; p.y += p.vy; p.rot += p.vr;
        cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.scale(1, Math.cos(p.rot * 2)); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2); cx.restore();
      }
      raf = (parts.length || trickle) ? requestAnimationFrame(step) : (cx.clearRect(0, 0, innerWidth, innerHeight), 0);
    };
    raf = requestAnimationFrame(step);
  }
  return {
    burst(n = 180) { for (let i = 0; i < n; i++) parts.push(piece(innerWidth * (0.15 + Math.random() * 0.7), innerHeight * (0.25 + Math.random() * 0.2), (Math.random() - 0.5) * 16, -6 - Math.random() * 12)); run(); },
    rain(v) { trickle = v; if (v) run(); },
  };
})();

/* ---------- screens: rebuild on key change, update in place otherwise ---------- */
const app = $('#app');
let screenKey = '', screen = null;
function show(key, build) {
  if (key === screenKey && screen) { if (screen.update) screen.update(); fitSoon(); return; }
  screenKey = key; const wrap = h('div', 'wrap'); app.textContent = ''; app.appendChild(wrap);
  scrollTo(0, 0);  // a new screen starts at the top, even if the last one was scrolled down
  screen = build(wrap) || {}; if (screen.update) screen.update();
  fitSoon();
}

/* The TV question and answer screens must fit on one screen, whatever the screen is: nobody can
   scroll a TV mid-game. Shrink the photo first, then the fact text, then the answer buttons. */
let fitT = 0;
function fitSoon() { cancelAnimationFrame(fitT); fitT = requestAnimationFrame(fitTV); }
function fitTV() {
  const w = app.firstElementChild;
  if (!w) return;
  const els = [...w.querySelectorAll('.photo-box img, .manger svg, .fact, .verse, .reveal-who .script, .opt, .ask')];
  els.forEach(e => { e.style.height = e.style.fontSize = e.style.minHeight = e.style.minWidth = ''; });
  // the TV fits its question and answer screens; a phone fits its question screen so the
  // answer buttons are there without scrolling
  if (!(screenKey.startsWith('q-') || (HOST && (screenKey.startsWith('r-') || screenKey.startsWith('in-'))))) return;
  const over = () => {
    let bottom = 0;
    for (const c of w.querySelectorAll('.qhead, .timer, .photo-box, .manger, .fact, .verse, .lead, .ask, .opts, .hostbar, .board, .reveal-who, .intro .btn'))
      bottom = Math.max(bottom, c.getBoundingClientRect().bottom);
    return bottom + 10 - innerHeight;
  };
  const img = w.querySelector('.photo-box img') || w.querySelector('.manger svg'), fact = w.querySelector('.fact') || w.querySelector('.verse'), who = w.querySelector('.reveal-who .script'), opts = [...w.querySelectorAll('.opt')], ask = w.querySelector('.ask');
  for (let i = 0, o = over(); o > 0 && i < 40; i++, o = over()) {
    if (img && img.getBoundingClientRect().height > innerHeight * 0.18) {
      img.style.minWidth = '0'; img.style.height = Math.max(innerHeight * 0.18, img.getBoundingClientRect().height - o - 2) + 'px';
    } else if (who && parseFloat(getComputedStyle(who).fontSize) > 34) {
      who.style.fontSize = parseFloat(getComputedStyle(who).fontSize) * 0.85 + 'px';
    } else if (fact && parseFloat(getComputedStyle(fact).fontSize) > 15) {
      fact.style.fontSize = parseFloat(getComputedStyle(fact).fontSize) * 0.9 + 'px';
    } else if (opts.length && parseFloat(getComputedStyle(opts[0]).fontSize) > 15) {
      const f = parseFloat(getComputedStyle(opts[0]).fontSize) * 0.9, mh = Math.max(44, opts[0].getBoundingClientRect().height * 0.9);
      opts.forEach(b => { b.style.fontSize = f + 'px'; b.style.minHeight = mh + 'px'; });
      if (ask) ask.style.fontSize = Math.max(18, parseFloat(getComputedStyle(ask).fontSize) * 0.9) + 'px';
    } else break;
  }
}
addEventListener('resize', fitSoon);

function playerRender() {

  if (!st || st.phase === 'off') return show('wait', w => {
    w.appendChild(h('p', 'eyebrow', 'Christmas party game'));
    w.appendChild(h('h1', '', 'Who Wrote This?'));
    w.appendChild(h('p', 'lead', "No game running yet. When the host opens the TV screen, this page updates by itself."));

  // an answer that was still on its way can land after this screen first shows: rebuild if results change
  if (st.phase === 'done') return show('done-' + st.gid + (me ? '' : '-x') + boardSig(g), w => {
    w.appendChild(h('h1', '', 'That’s a wrap!'));
    const board = scores(g, (st.qs || []).length - 1), r = rankOf(board, PID);
    if (me && r) {
      const c = h('div', 'card big-msg');
      const pic = h('div', r <= 3 ? 'cheer' : 'wave'); pic.style.width = '84px'; pic.innerHTML = elfSVG(PID, me.look); c.appendChild(pic);
      if (r <= 3) setTimeout(() => { Confetti.burst(120); }, 400);
      c.appendChild(h('p', 'script', 'You came ' + ordinal(r)));
      c.appendChild(h('p', 'score', board[r - 1].score.toLocaleString() + ' points'));

    }

  });
  if (st.phase === 'intro') return show('in-' + st.gid, w => {
    w.appendChild(h('p', 'eyebrow', 'Christmas party game'));
    const c = h('div', 'card big-msg');
    c.appendChild(mangerView());
    c.append(h('p', 'script', 'Look at the TV'), h('p', 'lead', 'A quick word first. You’ll add your baby photo right after.'));
    w.appendChild(c);
  });
  if (!me) return show('join-' + st.gid, w => joinScreen(w, g));
  if (st.phase === 'lobby') return show('lobby-' + st.gid, w => lobbyScreen(w));
  const q = (st.qs || [])[st.qi];

  if (st.phase === 'reveal') return show('r-' + st.gid + '-' + st.qi, w => revealScreenPhone(w, q));
}

function questionScreen(w, q) {

  }, 250);

async function startGame(btn) {
  btn.disabled = true;
  await db.refresh();
  const g = game();
  if (!g.st || g.st.phase !== 'lobby') return;
  const ids = g.players.map(p => p.id);
  let es = shuffle(g.entries.filter(e => ids.includes(e.pid)));
  const cap = g.st.maxq || 0;
  if (cap && es.length > cap) {
    const by = new Map(); es.forEach(e => { if (!by.has(e.pid)) by.set(e.pid, []); by.get(e.pid).push(e); });
    const pick = []; let round = 0;
    while (pick.length < cap) {
      const layer = shuffle([...by.values()].map(list => list[round]).filter(Boolean));
      if (!layer.length) break;
      pick.push(...layer.slice(0, cap - pick.length)); round++;
    }
    es = shuffle(pick);
  }
  for (let i = 1; i < es.length; i++) if (es[i].pid === es[i - 1].pid) {
    const j = es.findIndex((e, k) => k > i && e.pid !== es[i - 1].pid);
    if (j > 0) [es[i], es[j]] = [es[j], es[i]];
  }
  const kindOf = id => { const p = g.players.find(x => x.id === id), k = p && p.look && p.look.g; return k === 'm' || k === 'f' ? k : null; };
  const decoys = pid => {
    const others = ids.filter(x => x !== pid), k = kindOf(pid);
    const same = k ? shuffle(others.filter(x => kindOf(x) === k)) : [];
    return [...same, ...shuffle(others.filter(x => !same.includes(x)))].slice(0, 3);
  };
  const qs = es.map(e => ({ e: e.id, a: e.pid, o: shuffle([e.pid, ...decoys(e.pid)]) }));
  if (!qs.length) { btn.disabled = false; return; }
  try { await db.set(STATE, { ...g.st, phase: 'play', qi: 0, qs, at: Date.now() }); } catch (e) { btn.disabled = false; }
}

function hostIntro(w) {
  const c = h('div', 'intro');
  c.append(h('p', 'eyebrow', 'Before we start…'), h('h1', '', 'Every one of us was a baby once.'), h('p', 'lead big', 'So was Jesus.'));
  c.appendChild(mangerView());
  c.appendChild(verseView(VERSE_INTRO));
  c.appendChild(h('p', 'lead', 'God didn’t come as a king in a palace. He came as a baby, just like us. So tonight, let’s see what we all looked like as babies.'));
  const b = h('button', 'btn huge', 'Let’s play'); b.type = 'button';
  b.addEventListener('click', () => goPhase(b, 'intro', { phase: 'lobby' }));
  c.appendChild(b); w.appendChild(c);
  b.focus({ preventScroll: true });
}

function hostQuestion(w, q) {
  const g0 = game(), st = g0.st, lim = (st.limit || 20) * 1000, t0 = Date.now() - Math.min(Math.max(0, Date.now() - (st.at || Date.now())), lim);
  revealing = false;
  const hd = h('div', 'qhead'); const qn = h('span', '', 'Question ' + (st.qi + 1) + ' of ' + st.qs.length); const ans = h('span');
  hd.append(qn, ans); w.appendChild(hd);
  const bar = timerBar(); w.appendChild(bar);
  const entry = g0.entries.find(e => e.id === q.e);
  w.appendChild(factView(entry));
  w.appendChild(h('p', 'ask', askText(entry)));
  w.appendChild(optionGrid(g0, q, {}));
  const hb = h('div', 'hostbar'); const now = h('button', 'btn ghost small', 'Reveal now'); now.type = 'button';
  hb.append(now); w.appendChild(hb);
  now.addEventListener('click', () => reveal());
  Sound.question(); let lastSec = 99;
  async function reveal() {
    if (revealing) return; revealing = true;
    const s = game().st; if (s.phase !== 'play') return;
    try { await db.set(STATE, { ...s, phase: 'reveal', at: Date.now() }); } catch (e) { revealing = false; }
  }
  const tick = setInterval(() => {
    if (!document.contains(bar)) return clearInterval(tick);
    const el = Date.now() - t0; bar.firstChild.style.transform = 'scaleX(' + Math.max(0, 1 - el / lim) + ')';
    const sec = Math.ceil((lim - el) / 1000); if (sec !== lastSec && sec > 0 && sec <= 5 && !revealing) Sound.tick(sec <= 3); lastSec = sec;
    if (el >= lim) reveal();
  }, 250);
  function update() {
    const g = game();
    const eligible = g.players.filter(p => p.id !== q.a);
    const got = g.answers.filter(a => a.qi === st.qi && a.pid !== q.a);
    ans.textContent = got.length + ' of ' + eligible.length + ' answered';
    if (eligible.length && got.length >= eligible.length) setTimeout(reveal, 600);
  }
  return { update };
}

function hostReveal(w, q) {
  const g = game(), st = g.st;
  const hd = h('div', 'qhead'); hd.appendChild(h('span', '', 'Question ' + (st.qi + 1) + ' of ' + st.qs.length)); w.appendChild(hd);
  const grid = h('div', 'tv-grid'); w.appendChild(grid);
  const leftC = h('div', 'rev'); leftC.style.display = 'flex'; leftC.style.flexDirection = 'column'; leftC.style.gap = '16px';
  const entry = g.entries.find(e => e.id === q.e);
  leftC.appendChild(factView(entry));
  Sound.reveal();
  const who = h('div', 'reveal-who'); who.appendChild(h('p', 'eyebrow', revealLabel(entry))); who.appendChild(h('p', 'script', nameOf(g, q.a)));
  leftC.appendChild(who);
  const optBox = h('div'); leftC.appendChild(optBox);
  grid.appendChild(leftC);
  const right = h('div', 'card'); right.appendChild(h('p', 'lbl', 'Leaderboard'));
  const ol = h('ol', 'board');
  right.appendChild(ol); grid.appendChild(right);
  let sig = '';
  function update() {
    const g = game(), here = g.answers.filter(a => a.qi === st.qi);
    const s2 = JSON.stringify([here.map(a => a.pid + a.choice + a.ms), g.players.map(p => p.id + p.name)]);
    if (s2 === sig) return; sig = s2;
    const counts = {}; here.forEach(a => { counts[a.choice] = (counts[a.choice] || 0) + 1; });
    optBox.textContent = ''; optBox.appendChild(optionGrid(g, q, { reveal: true, counts }));
    const board = scores(g, st.qi), gains = new Map(here.map(a => [a.pid, points(st, a, q)]));
    ol.textContent = '';
    board.slice(0, 6).forEach((r, i) => {
      const li = h('li'); li.appendChild(h('span', 'rk', String(i + 1))); li.appendChild(h('span', 'nm', r.name));
      if (gains.get(r.id)) li.appendChild(h('span', 'gain', '+' + gains.get(r.id)));
      li.appendChild(h('span', 'score', r.score.toLocaleString())); ol.appendChild(li);
    });
  }
  const last = st.qi >= st.qs.length - 1;
  const hb = h('div', 'hostbar'); const end = h('button', 'btn ghost small', 'End game'); end.type = 'button';
  const next = h('button', 'btn', last ? 'See the winners' : 'Next question'); next.type = 'button';
  hb.append(end, next); w.appendChild(hb);
  next.addEventListener('click', () => advance(next));
  end.addEventListener('click', () => {
    if (armed !== 'end') { armed = 'end'; end.textContent = 'Tap again to end'; setTimeout(() => { if (armed === 'end') { armed = ''; end.textContent = 'End game'; } }, 3500); return; }
    armed = ''; db.set(STATE, { ...game().st, phase: 'done', at: Date.now() }).catch(() => {});
  });
  next.focus({ preventScroll: true });
  return { update };
}
async function advance(btn) {
  const st = game().st; if (st.phase !== 'reveal') return;
  if (btn) btn.disabled = true;
  const last = st.qi >= st.qs.length - 1;
  try { await db.set(STATE, last ? { ...st, phase: 'done', at: Date.now() } : { ...st, phase: 'play', qi: st.qi + 1, at: Date.now() }); }
  catch (e) { if (btn) btn.disabled = false; }
}

function hostDone(w) {
  const g = game(), st = g.st;
  w.classList.add('done-wrap');
  const board = scores(g, (st.qs || []).length - 1);
  const head = h('div', 'done-head');
  const tt = h('div'); tt.append(h('p', 'eyebrow', 'Final scores'), h('h1', '', 'And the winner is…'));
  const again = h('button', 'btn', 'Play again with new photos'); again.type = 'button';
  head.append(tt, again); w.appendChild(head);
  // 1st in the middle; 2nd, 3rd, 4th… spread out to both sides on one level
  const left = [], right = [];
  board.slice(1).forEach((r, i) => (i % 2 === 0 ? left : right).push(i + 1));
  const seq = board.length ? [...left.reverse(), 0, ...right] : [];
  const n = Math.max(1, seq.length);
  const pod = h('div', 'podium2');
  const crowd = n >= 10;
  pod.style.gridTemplateColumns = seq.map(ri => ri === 0 ? (crowd ? '2.6fr' : '1fr') : '1fr').map(f => 'minmax(0,' + f + ')').join(' ');
  if (crowd) pod.classList.add('crowd');
  pod.style.setProperty('--n', n);
  pod.style.setProperty('--nm', n <= 3 ? '5vmin' : n <= 6 ? '3.6vmin' : n <= 9 ? '2.8vmin' : n <= 14 ? '2.4vmin' : '2vmin');
  pod.style.setProperty('--elf', n <= 3 ? '11vmin' : n <= 6 ? '9vmin' : n <= 9 ? '7vmin' : n <= 14 ? '6vmin' : '5vmin');
  const FIRST = 3.0;
  seq.forEach((ri, k) => {
    const r = board[ri], place = ri + 1, first = place === 1;
    const col = h('div', 'pcol ' + (first ? 'p1' : 'rest c' + (place % 3)));
    col.style.setProperty('--dl', (first ? FIRST : 0.4 + Math.min(1.6, (place - 2) * 0.18)) + 's');
    const who = h('div', 'who');
    if (first) { who.appendChild(h('div', 'rays')); who.appendChild(h('div', 'star', '★')); }
    const e = h('div', 'elfstand ' + (first ? 'cheer' : 'wave')); e.innerHTML = elfSVG(r.id, (g.players.find(p => p.id === r.id) || {}).look); who.appendChild(e);
    who.append(h('p', 'nm', r.name), h('p', 'pts', r.score.toLocaleString() + (crowd && !first ? '' : ' pts')));
    col.append(who, h('div', 'blk', first ? '1st' : '')); pod.appendChild(col);
  });
  if (!board.length) w.appendChild(h('p', 'lead', 'Nobody played this round.'));
  w.appendChild(pod);
  again.addEventListener('click', () => {
    if (armed !== 'again') { armed = 'again'; again.textContent = 'Tap again: this clears everyone’s photos'; setTimeout(() => { if (armed === 'again') { armed = ''; again.textContent = 'Play again with new photos'; } }, 3500); return; }
    armed = ''; Confetti.rain(false); newGame(again);
  });
  Sound.theme(null); Sound.drumroll(FIRST);
  setTimeout(() => { if (!document.contains(pod)) return; Sound.fanfare(); Confetti.burst(220); Confetti.rain(true); setTimeout(() => { if (document.contains(pod)) Sound.theme('done'); }, 2400); }, (FIRST + 0.3) * 1000);
}

document.addEventListener('keydown', e => {
  if (!HOST || e.target.matches('input,textarea,select')) return;
  if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'Enter') {
    const st = (game().st || {});
    if (st.phase === 'reveal' && !e.target.matches('button')) { e.preventDefault(); advance(); }
    else if (st.phase === 'intro' && !e.target.matches('button')) { e.preventDefault(); goPhase(null, 'intro', { phase: 'lobby' }); }
  }
});

/* ---------- snow ---------- */
(function scene() {
  const cv = $('#snow'), ctx = cv.getContext('2d'), still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w = 0, ht = 0, trees = [];
  const fl = Array.from({ length: 60 }, () => ({ x: Math.random(), y: Math.random(), r: 1 + Math.random() * 2.4, v: 0.0006 + Math.random() * 0.0012, p: Math.random() * 6.3 }));
  const size = () => {
    const r = Math.min(devicePixelRatio || 1, 2); w = innerWidth; ht = innerHeight; cv.width = w * r; cv.height = ht * r; ctx.setTransform(r, 0, 0, r, 0, 0);
    let x = 7; const rnd = () => (x = (x * 48271) % 2147483647) / 2147483647;
    const n = Math.max(6, Math.round(w / 150)); trees = [];
    for (let i = 0; i < n; i++) trees.push({ x: (i + 0.5) / n * w + (rnd() - 0.5) * (w / n) * 0.7, s: 0.65 + rnd() * 0.6, far: i % 3 === 1 });
  };
  const tree = (x, base, hs, dark) => {
    ctx.fillStyle = dark ? '#2E4F4B' : '#5F8A84';
    for (let k = 0; k < 3; k++) { const tier = base - hs * 0.22 * k, half = hs * (0.42 - 0.1 * k); ctx.beginPath(); ctx.moveTo(x - half, tier); ctx.lineTo(x, tier - hs * 0.45); ctx.lineTo(x + half, tier); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = '#FFFFFF';
    for (let k = 0; k < 3; k++) { const tier = base - hs * 0.22 * k, half = hs * (0.42 - 0.1 * k); ctx.beginPath(); ctx.moveTo(x - half * 0.75, tier - hs * 0.05); ctx.quadraticCurveTo(x, tier - hs * 0.16, x + half * 0.75, tier - hs * 0.05); ctx.quadraticCurveTo(x, tier + hs * 0.02, x - half * 0.75, tier - hs * 0.05); ctx.fill(); }
    ctx.fillStyle = '#7A4A3A'; ctx.fillRect(x - hs * 0.04, base, hs * 0.08, hs * 0.12);
  };
  const ground = () => {
    const g = ht * 0.94, unit = Math.min(w, ht);
    trees.filter(t => t.far).forEach(t => tree(t.x, g - 2, unit * 0.2 * t.s, false));
    trees.filter(t => !t.far).forEach(t => tree(t.x, g + 4, unit * 0.28 * t.s, true));
    ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.moveTo(0, g + 10);
    for (let x = 0; x <= w + 20; x += 20) ctx.lineTo(x, g + 8 + Math.sin(x / 160) * 6 + Math.cos(x / 53) * 3);
    ctx.lineTo(w, ht); ctx.lineTo(0, ht); ctx.closePath(); ctx.fill();
  };
  size(); addEventListener('resize', size);
  const frame = () => {
    ctx.clearRect(0, 0, w, ht);
    if (HOST && document.body.dataset.scene === 'full') ground();
    ctx.fillStyle = '#fff';
    for (const f of fl) { if (!still) { f.y += f.v; f.p += 0.01; if (f.y > 1.02) { f.y = -0.02; f.x = Math.random(); } } ctx.globalAlpha = 0.6; ctx.beginPath(); ctx.arc(f.x * w + Math.sin(f.p) * 8, f.y * ht, f.r, 0, 6.2832); ctx.fill(); }
    ctx.globalAlpha = 1;
    if (!still) requestAnimationFrame(frame); else setTimeout(frame, 1000);
  };
  frame();
})();

/* ---------- go ---------- */
const render = () => { try { (HOST ? hostRender : playerRender)(); } catch (e) { console.error(e); } };
// redraw on the next frame, or within 150ms if frames are paused (a background tab), so the screen
// is already right the moment someone looks at it
let rq = false;
db.onChange(() => {
  if (rq) return; rq = true;
  let done = false; const go = () => { if (done) return; done = true; rq = false; render(); };
  requestAnimationFrame(go); setTimeout(go, 150);
});
setTimeout(() => { if (!db.loaded) setStatus("Can't reach the game yet. Keep this page open; it keeps trying.", true); }, 10000);
db.start();
})();
